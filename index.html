<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <p>number of connected users <span id="cdusers"></span></p>
  </body>
  <script>
    let ws;
    const proto = window.location.protocol === "https" ? "wss" : "ws";
    ws = new WebSocket(`${proto}://${window.location.host}`);

    ws.onmessage = (event) => {
      console.log(event);
      console.log(event.data);
      if (event.data.startsWith("current visitors"))
        document.getElementById("cdusers").innerText = event.data.slice(16);
    };
  </script>
</html>
